name: Probe
options: { bundleIdPrefix: nl.sbvh.probe }
targets:
  Probe:
    type: application
    platform: iOS
    deploymentTarget: "17.2"
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    entitlements:
      path: App/Probe.entitlements
      properties:
        aps-environment: development
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: nl.sbvh.probe.app, GENERATE_INFOPLIST_FILE: NO, CODE_SIGN_IDENTITY: "-", CODE_SIGN_STYLE: Manual } }
    dependencies: [{ target: ProbeWidget, embed: true }]
  ProbeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.2"
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Probe
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: nl.sbvh.probe.app.widget, CODE_SIGN_IDENTITY: "-", CODE_SIGN_STYLE: Manual } }
