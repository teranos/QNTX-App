{
  "jobs": {
    "build": {
      "needs": "main",
      "runs-on": "macos-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 0,
            "fetch-tags": true,
            "path": "qntx",
            "ref": "${{ needs.main.outputs.sha }}",
            "repository": "teranos/QNTX"
          }
        },
        {
          "id": "qntx",
          "name": "What main is",
          "run": "built=$(git describe --tags --match 'v*')\nversion=$(git tag -l 'v*' | sort -V | tail -1)\ntest -n \"$built\" && test -n \"$version\"\necho \"built=$built\" >> \"$GITHUB_OUTPUT\"\necho \"version=${version#v}\" >> \"$GITHUB_OUTPUT\"\necho \"QNTX_TAG=$built\" >> \"$GITHUB_ENV\"\necho \"building $built as $version\"\n",
          "working-directory": "qntx"
        },
        {
          "id": "rust",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "components": "clippy",
            "targets": "wasm32-unknown-unknown, aarch64-apple-ios"
          }
        },
        {
          "uses": "jetli/wasm-pack-action@v0.4.0",
          "with": {
            "version": "v0.13.1"
          }
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.3"
          }
        },
        {
          "name": "The wasm compiled last time",
          "uses": "actions/cache@v4",
          "with": {
            "key": "wasm-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('qntx/Cargo.lock', 'qntx/crates/**') }}",
            "path": "qntx/target\n~/.cargo/registry/index\n~/.cargo/registry/cache\n~/.cargo/git/db\n",
            "restore-keys": "wasm-${{ steps.rust.outputs.cachekey }}-\n"
          }
        },
        {
          "name": "The shell compiled last time",
          "uses": "actions/cache@v4",
          "with": {
            "key": "shell-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'qntx/crates/**') }}",
            "path": "target",
            "restore-keys": "shell-${{ steps.rust.outputs.cachekey }}-\n"
          }
        },
        {
          "env": {
            "BACKEND_URL": "${{ inputs.backend_url || 'https://api.q.sbvh.nl' }}",
            "SENTRY_DSN": "https://a67b1d3869b2fadc7a314746a35039f4@o4511990405464064.ingest.de.sentry.io/4512033476902992"
          },
          "name": "Build the bundle the app carries",
          "run": "make web",
          "working-directory": "qntx"
        },
        {
          "name": "The lib answers for every error",
          "run": "cargo clippy --lib --target aarch64-apple-ios"
        },
        {
          "name": "Fetch tauri-cli 2.11.4",
          "run": "curl -sSL -o cargo-tauri.zip https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-aarch64-apple-darwin.zip\nunzip -o -q cargo-tauri.zip -d \"$HOME/.cargo/bin\"\nrm cargo-tauri.zip\ncargo tauri --version\n"
        },
        {
          "name": "The app is versioned as QNTX's newest release",
          "run": "python3 -c 'import json,sys; p=\"tauri.conf.json\"; c=json.load(open(p)); c[\"version\"]=sys.argv[1]; json.dump(c,open(p,\"w\"),indent=2); print(\"version\", c[\"version\"])' \"${{ steps.qntx.outputs.version }}\"\n"
        },
        {
          "run": "cargo tauri ios init"
        },
        {
          "env": {
            "APPLE_DEVELOPMENT_TEAM": "${{ secrets.APPLE_DEVELOPMENT_TEAM }}",
            "PROVISIONING_PROFILE": "${{ vars.PROVISIONING_PROFILE }}"
          },
          "name": "Sign against the profile, not an account",
          "run": "python3 .github/scripts/ios-project.py gen/apple/project.yml\ncd gen/apple && xcodegen generate\n"
        },
        {
          "env": {
            "APPLE_DEVELOPMENT_TEAM": "${{ secrets.APPLE_DEVELOPMENT_TEAM }}",
            "IOS_CERTIFICATE": "${{ secrets.IOS_CERTIFICATE }}",
            "IOS_CERTIFICATE_PASSWORD": "${{ secrets.IOS_CERTIFICATE_PASSWORD }}",
            "IOS_MOBILE_PROVISION": "${{ secrets.IOS_MOBILE_PROVISION }}"
          },
          "name": "Build signed IPA",
          "run": "cargo tauri ios build \\\n  --export-method app-store-connect \\\n  --build-number ${{ github.run_number }}\n"
        },
        {
          "id": "ipa",
          "name": "Locate IPA",
          "run": "FOUND=$(find . -name '*.ipa' -type f | head -1)\nif [ -z \"$FOUND\" ]; then\n  find gen/apple/build -type f 2>/dev/null\n  echo \"no ipa produced\"\n  exit 1\nfi\necho \"path=$FOUND\" >> \"$GITHUB_OUTPUT\"\necho \"Found $FOUND\"\n"
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}"
          },
          "name": "Upload to TestFlight",
          "run": "mkdir -p ~/.appstoreconnect/private_keys\necho \"$APPLE_API_KEY_CONTENT\" | base64 --decode \\\n  > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8\nxcrun altool --upload-app \\\n  -f \"${{ steps.ipa.outputs.path }}\" \\\n  --api-key \"$APPLE_API_KEY\" \\\n  --api-issuer \"$APPLE_API_ISSUER\"\n"
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}",
            "BUILD": "${{ steps.qntx.outputs.version }}.${{ github.run_number }}"
          },
          "name": "Delivered to testers",
          "run": "python3 -m venv \"$RUNNER_TEMP/asc\"\n\"$RUNNER_TEMP/asc/bin/pip\" install --quiet 'pyjwt[crypto]' requests\n\"$RUNNER_TEMP/asc/bin/python\" .github/scripts/delivered.py wait \"$BUILD\"\n"
        }
      ]
    },
    "main": {
      "outputs": {
        "sha": "${{ steps.main.outputs.sha }}"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "id": "main",
          "name": "Where main is",
          "run": "sha=$(git ls-remote https://github.com/teranos/QNTX refs/heads/main | cut -f1)\ntest -n \"$sha\"\necho \"sha=$sha\" >> \"$GITHUB_OUTPUT\"\necho \"main is $sha\"\n"
        }
      ]
    }
  },
  "name": "testflight",
  "on": {
    "push": null,
    "workflow_dispatch": {
      "inputs": {
        "backend_url": {
          "default": "https://api.q.sbvh.nl",
          "description": "API origin baked into the bundle",
          "type": "string"
        },
        "ground": {
          "default": "",
          "description": "the performance and rite that dispatched this",
          "type": "string"
        }
      }
    }
  },
  "run-name": "testflight ${{ github.ref_name }} ${{ inputs.ground }}"
}
