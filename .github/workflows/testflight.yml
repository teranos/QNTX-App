{
  "jobs": {
    "build": {
      "defaults": {
        "run": {
          "working-directory": "."
        }
      },
      "env": {
        "IOS_SHARE_EXTENSION": "${{ vars.IOS_SHARE_EXTENSION }}"
      },
      "needs": "main",
      "runs-on": "xcode-27",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Xcode 27.2",
          "run": "sudo xcode-select -s /Applications/Xcode_27.2.app\nxcodebuild -version\nxcrun --sdk iphoneos --show-sdk-version\n"
        },
        {
          "id": "rust",
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "components": "clippy",
            "targets": "aarch64-apple-ios"
          }
        },
        {
          "uses": "actions/cache@v4",
          "with": {
            "key": "ios-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'qntx/crates/**') }}",
            "path": "target",
            "restore-keys": "ios-${{ steps.rust.outputs.cachekey }}-"
          }
        },
        {
          "name": "ios-common v0.3.1",
          "run": "git clone -q --depth 1 --branch v0.3.1 https://github.com/teranos/ios-common \"$RUNNER_TEMP/ios-common\"\necho \"IOS_COMMON=$RUNNER_TEMP/ios-common/apple\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 0,
            "fetch-tags": true,
            "path": "qntx",
            "ref": "${{ needs.main.outputs.sha }}",
            "repository": "teranos/QNTX"
          }
        },
        {
          "uses": "actions/checkout@v5",
          "with": {
            "path": "qntx-web",
            "ref": "${{ inputs.web_ref || 'main' }}",
            "repository": "teranos/QNTX-Web"
          }
        },
        {
          "id": "qntx",
          "name": "What main is",
          "run": "built=$(git describe --tags --match 'v*')\nversion=$(git tag -l 'v*' | sort -V | tail -1)\ntest -n \"$built\" && test -n \"$version\"\necho \"built=$built\" >> \"$GITHUB_OUTPUT\"\necho \"version=${version#v}\" >> \"$GITHUB_OUTPUT\"\necho \"QNTX_TAG=$built\" >> \"$GITHUB_ENV\"\necho \"building $built as $version\"\n",
          "working-directory": "qntx"
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.9"
          }
        },
        {
          "env": {
            "BACKEND_URL": "${{ inputs.backend_url || 'https://api.q.sbvh.nl' }}",
            "SENTRY_DSN": "${{ vars.WEB_SENTRY_DSN }}"
          },
          "name": "Build the bundle the app carries",
          "run": "bun install --frozen-lockfile\nbun run build\n",
          "working-directory": "qntx-web"
        },
        {
          "name": "The app is versioned as QNTX's newest release",
          "run": "python3 -c 'import json,sys; p=\"tauri.conf.json\"; c=json.load(open(p)); c[\"version\"]=sys.argv[1]; json.dump(c,open(p,\"w\"),indent=2); print(\"version\", c[\"version\"])' \"${{ steps.qntx.outputs.version }}\"\n"
        },
        {
          "name": "The lib answers for every error",
          "run": "cargo clippy --lib --target aarch64-apple-ios -- -D warnings"
        },
        {
          "env": {
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}",
            "IOS_CERTIFICATE": "${{ secrets.IOS_CERTIFICATE }}"
          },
          "id": "signing",
          "name": "Signing material",
          "run": "if [ -n \"$IOS_CERTIFICATE\" ] && [ -n \"$APPLE_API_KEY_CONTENT\" ]; then\n  echo \"held=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"::warning::no Apple signing secrets here: the app is proven, not signed\"\n  echo \"held=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}",
            "IOS_CERTIFICATE": "${{ secrets.IOS_CERTIFICATE }}",
            "IOS_CERTIFICATE_PASSWORD": "${{ secrets.IOS_CERTIFICATE_PASSWORD }}"
          },
          "if": "steps.signing.outputs.held == 'true'",
          "name": "App IDs, capabilities and profile at Apple",
          "run": "python3 -m venv \"$RUNNER_TEMP/asc\"\n\"$RUNNER_TEMP/asc/bin/pip\" install --quiet 'pyjwt[crypto]' requests\n\"$RUNNER_TEMP/asc/bin/python\" \"$IOS_COMMON/apple.py\" apple.json \"$RUNNER_TEMP/profiles\"\necho \"IOS_MOBILE_PROVISION=$(base64 < \"$RUNNER_TEMP/profiles/app.mobileprovision\" | tr -d '\\n')\" >> \"$GITHUB_ENV\"\nif [ -f \"$RUNNER_TEMP/profiles/island.mobileprovision\" ]; then\n  echo \"IOS_ISLAND_MOBILE_PROVISION=$(base64 < \"$RUNNER_TEMP/profiles/island.mobileprovision\" | tr -d '\\n')\" >> \"$GITHUB_ENV\"\nfi\n"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Fetch tauri-cli 2.11.4",
          "run": "curl -sSL -o cargo-tauri.zip https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-aarch64-apple-darwin.zip\nmkdir -p \"$HOME/.cargo/bin\"\nunzip -o -q cargo-tauri.zip -d \"$HOME/.cargo/bin\"\nrm cargo-tauri.zip\ncargo tauri --version\n"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "name": "The Xcode project",
          "run": "cargo tauri ios init"
        },
        {
          "env": {
            "APPLE_DEVELOPMENT_TEAM": "${{ secrets.APPLE_DEVELOPMENT_TEAM }}",
            "ISLAND": "${{ runner.temp }}/ios-common/island",
            "ISLAND_NODE": "${{ inputs.backend_url || 'https://api.q.sbvh.nl' }}",
            "ISLAND_SENTRY_DSN": "${{ vars.ISLAND_SENTRY_DSN }}",
            "PROVISIONING_PROFILE": "QNTX"
          },
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Sign against the profile, not an account",
          "run": "python3 \"$IOS_COMMON/ios-project.py\" gen/apple/project.yml"
        },
        {
          "env": {
            "APPLE_DEVELOPMENT_TEAM": "${{ secrets.APPLE_DEVELOPMENT_TEAM }}",
            "IOS_SHARE_MOBILE_PROVISION": "${{ secrets.IOS_SHARE_MOBILE_PROVISION }}",
            "ISLAND_PROVISIONING_PROFILE": "QNTX island",
            "PROVISIONING_PROFILE": "QNTX",
            "SHARE_PROVISIONING_PROFILE": "${{ vars.SHARE_PROVISIONING_PROFILE }}"
          },
          "if": "steps.signing.outputs.held == 'true' && (vars.IOS_SHARE_EXTENSION == 'true')",
          "name": "Add the screenshot share extension when provisioned",
          "run": "python3 -m venv \"$RUNNER_TEMP/share-tools\"\n\"$RUNNER_TEMP/share-tools/bin/pip\" install PyYAML==6.0.3\npython3 .github/scripts/install-share-profile.py\n\"$RUNNER_TEMP/share-tools/bin/python\" .github/scripts/ios-share-project.py gen/apple/project.yml --version \"${{ steps.qntx.outputs.version }}\" --build \"${{ steps.qntx.outputs.version }}.${{ github.run_number }}\"\n"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Generate the signed Xcode project",
          "run": "cd gen/apple && xcodegen generate"
        },
        {
          "env": {
            "APPLE_DEVELOPMENT_TEAM": "${{ secrets.APPLE_DEVELOPMENT_TEAM }}",
            "IOS_CERTIFICATE": "${{ secrets.IOS_CERTIFICATE }}",
            "IOS_CERTIFICATE_PASSWORD": "${{ secrets.IOS_CERTIFICATE_PASSWORD }}"
          },
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Build the signed IPA",
          "run": "if [ \"$IOS_SHARE_EXTENSION\" = \"true\" ]; then\n  cargo tauri ios build --archive-only --build-number ${{ github.run_number }}\n  python3 .github/scripts/export-share-ipa.py\nelse\n  cargo tauri ios build --archive-only --build-number ${{ github.run_number }}\n  python3 \"$IOS_COMMON/export-island.py\"\nfi\n"
        },
        {
          "id": "ipa",
          "if": "steps.signing.outputs.held == 'true'",
          "name": "Locate the IPA",
          "run": "found=$(find gen -name '*.ipa' -type f | head -1)\ntest -n \"$found\" || { find gen/apple/build -type f 2>/dev/null; echo \"no ipa produced\"; exit 1; }\necho \"path=$PWD/$found\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "if": "steps.signing.outputs.held == 'true'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "ipa",
            "path": "${{ steps.ipa.outputs.path }}"
          }
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}",
            "APPLE_APP_ID": "${{ vars.APPLE_APP_ID }}",
            "IPA": "${{ steps.ipa.outputs.path }}"
          },
          "if": "steps.signing.outputs.held == 'true' && vars.APPLE_APP_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')",
          "name": "Upload to TestFlight",
          "run": "sh \"$IOS_COMMON/upload.sh\" \"$IPA\" >> \"$GITHUB_ENV\""
        },
        {
          "env": {
            "APPLE_API_ISSUER": "${{ secrets.APPLE_API_ISSUER }}",
            "APPLE_API_KEY": "${{ secrets.APPLE_API_KEY }}",
            "APPLE_API_KEY_CONTENT": "${{ secrets.APPLE_API_KEY_CONTENT }}"
          },
          "if": "steps.signing.outputs.held == 'true' && vars.APPLE_APP_ID != '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')",
          "name": "Delivered to testers",
          "run": "\"$RUNNER_TEMP/asc/bin/python\" \"$IOS_COMMON/delivered.py\" wait \"$BUILD\""
        }
      ]
    },
    "main": {
      "outputs": {
        "sha": "${{ steps.main.outputs.sha }}"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "id": "main",
          "name": "Where main is",
          "run": "sha=$(git ls-remote https://github.com/teranos/QNTX refs/heads/main | cut -f1)\ntest -n \"$sha\"\necho \"sha=$sha\" >> \"$GITHUB_OUTPUT\"\necho \"main is $sha\"\n"
        }
      ]
    }
  },
  "name": "testflight",
  "on": {
    "push": {
      "paths-ignore": [
        "checks/**",
        "ci/checks.nix",
        ".github/workflows/checks.yml"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "backend_url": {
          "default": "https://api.q.sbvh.nl",
          "description": "API origin baked into the bundle",
          "type": "string"
        },
        "ground": {
          "default": "",
          "description": "the performance and rite that dispatched this",
          "type": "string"
        },
        "web_ref": {
          "default": "main",
          "description": "the QNTX-Web ref the page is built from: a tag, or main",
          "type": "string"
        }
      }
    }
  },
  "run-name": "testflight ${{ github.ref_name }} ${{ inputs.ground }}"
}
