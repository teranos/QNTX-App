{
  "jobs": {
    "ios": {
      "name": "QNTX-App idle in the iPhone Simulator",
      "runs-on": "macos-15",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "uses": "actions/checkout@v5",
          "with": {
            "path": "qntx",
            "repository": "teranos/QNTX"
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "targets": "aarch64-apple-ios-sim, wasm32-unknown-unknown"
          }
        },
        {
          "uses": "jetli/wasm-pack-action@v0.4.0",
          "with": {
            "version": "v0.13.1"
          }
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.3.3"
          }
        },
        {
          "name": "Fetch tauri-cli 2.11.4",
          "run": "curl -sSL -o cargo-tauri.zip https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-aarch64-apple-darwin.zip\nunzip -o -q cargo-tauri.zip -d \"$HOME/.cargo/bin\"\nrm cargo-tauri.zip\ncargo tauri --version\n"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "cargo tauri ios init"
        },
        {
          "name": "Boot an iPhone",
          "run": "RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == \"iOS\")] | sort_by(.version) | last | .identifier')\nUDID=$(xcrun simctl list devices available -j | jq -r --arg rt \"$RUNTIME\" '[.devices[$rt][] | select(.name | startswith(\"iPhone\"))] | first | .udid')\necho \"UDID=$UDID\" >> \"$GITHUB_ENV\"\nxcrun simctl boot \"$UDID\"\nxcrun simctl bootstatus \"$UDID\" -b\n"
        },
        {
          "name": "QNTX's page as main builds it, on its door, left alone",
          "run": "(cd qntx && make web)\nbash ci/app-idle/run.sh door\n",
          "timeout-minutes": 60
        },
        {
          "if": "always()",
          "name": "What was read",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "if-no-files-found": "warn",
            "name": "app-idle",
            "path": "idle-samples",
            "retention-days": 14
          }
        }
      ],
      "timeout-minutes": 90
    }
  },
  "name": "App idle",
  "on": {
    "pull_request": {
      "paths": [
        "ci/app-idle/**",
        "ci/app-idle.nix",
        ".github/workflows/app-idle.yml",
        "sheet/**",
        "power/**",
        "src/**",
        "tauri.conf.json",
        "tauri.ios.conf.json",
        "Info.ios.plist"
      ]
    },
    "workflow_dispatch": null
  }
}
