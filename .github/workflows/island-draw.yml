{
  "jobs": {
    "draw": {
      "name": "The island draws what waits, in the iPhone Simulator",
      "runs-on": "macos-15",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "run": "brew install xcodegen"
        },
        {
          "name": "Boot an iPhone",
          "run": "RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == \"iOS\")] | sort_by(.version) | last | .identifier')\nUDID=$(xcrun simctl list devices available -j | jq -r --arg rt \"$RUNTIME\" '[.devices[$rt][] | select(.name | startswith(\"iPhone\"))] | first | .udid')\necho \"UDID=$UDID\" >> \"$GITHUB_ENV\"\necho \"runtime: $RUNTIME\"\nxcrun simctl boot \"$UDID\"\nxcrun simctl bootstatus \"$UDID\" -b\n"
        },
        {
          "name": "Draw it",
          "run": "bash run.sh",
          "working-directory": "ci/island-draw"
        },
        {
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "island-drawn",
            "path": "ci/island-draw/seen"
          }
        }
      ],
      "timeout-minutes": 45
    }
  },
  "name": "Island drawn",
  "on": {
    "pull_request": {
      "paths": [
        "island/**",
        "ci/island-draw/**",
        "ci/island-draw.nix",
        ".github/workflows/island-draw.yml"
      ]
    },
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "island/**",
        "ci/island-draw/**"
      ]
    },
    "workflow_dispatch": null
  }
}
