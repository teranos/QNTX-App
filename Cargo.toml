[package]
name = "qntx-app"
version = "0.2.44"
description = "QNTX Application (Desktop & Mobile)"
authors = ["Sebastiaan Brandon van Houten <me@sbvh.nl>"]
license = "MIT"
repository = "https://github.com/teranos/QNTX-App"
edition = "2021"

[lib]
name = "qntx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qntx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# QNTX is checked out beside this, at the tag being built. The shell carries no
# copy of these and has no version of its own to pin them to.
qntx-proto = { path = "qntx/crates/qntx-proto" }
qntx-grpc = { path = "qntx/crates/qntx-grpc", default-features = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri = { version = "=2.11.5", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
# On every target: qntx:// is how a ceremony finished in Safari comes back
# into the app on a phone, carrying its ticket.
tauri-plugin-deep-link = "=2.4.10"

# Desktop-only plugins (not available on iOS/Android)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# QNTX's wall, and further. This is the one code that runs on a phone with no
# log anyone reads, so a dropped error reaches a person as the app closing.
[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
# The ones that panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
# The ones that drop a failure and carry on.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
let_underscore_future = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
match_wild_err_arm = "deny"
unwrap_in_result = "deny"
# The one that truncates: a read or write that moved fewer bytes than asked.
unused_io_amount = "deny"
dbg_macro = "deny"
